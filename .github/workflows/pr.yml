name: Build & Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: Build, format check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kubernetes.EnvTest.slnx

      - name: Verify code style (dotnet format)
        run: dotnet format Kubernetes.EnvTest.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Kubernetes.EnvTest.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test test/Kubernetes.EnvTest.Tests/Kubernetes.EnvTest.Tests.csproj -c Release --no-build

      - name: Integration tests (Aspire AppHost + real control plane)
        run: dotnet test test/Kubernetes.EnvTest.IntegrationTests/Kubernetes.EnvTest.IntegrationTests.csproj -c Release --no-build

  aot-smoke:
    # Publishes the CLI with Native AOT for this runner's RID only, surfacing
    # trim/AOT analysis warnings (e.g. from System.CommandLine or YamlDotNet)
    # on every PR rather than at release time. PR builds never cross-compile
    # the full RID matrix; that lives in release.yml.
    name: Native AOT publish smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish setup-envtest (Native AOT, current RID)
        run: dotnet publish src/Kubernetes.EnvTest.Tool -c Release -r linux-x64

      - name: Run the published binary
        run: ./src/Kubernetes.EnvTest.Tool/bin/Release/net10.0/linux-x64/publish/setup-envtest --help
