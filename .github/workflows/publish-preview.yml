name: Publish PR Preview to GitHub Packages

# Chat-ops trigger: comment "/publish-preview" on a PR to build, test, and
# publish that PR branch's current code as a preview NuGet package to this
# repo's GitHub Packages feed, for manual testing before a real release.
#
# Restricted to the logins listed in the CHATOPS_AUTHORIZED_USERS secret
# (shared across any chat-ops workflow in this repo, not just this one) via
# the verify-chatops-authorization action, checked BEFORE any PR code is
# touched. issue_comment fires for every commenter on a public repo, and
# dotnet build/pack executes arbitrary MSBuild targets from the checked-out
# code, so an unrestricted trigger (or one that trusted the PR's own copy of
# the allow-list) would let anyone run arbitrary code in this job using its
# GITHUB_TOKEN. A secret (rather than a committed file) also keeps the list
# of authorized logins off a public repo and restricts edits to repo admins.
#
# Feedback: the trigger comment gets an eyes reaction immediately, and a PR
# comment is posted for every terminal outcome (not authorized, build/test
# failure, pack/publish failure, or success) so progress is visible without
# checking the Actions tab.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write # reactions on the triggering comment use the issue-comments API

jobs:
  authorize:
    name: Authorize commenter & resolve PR
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/publish-preview')
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pr.outputs.ref }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Acknowledge command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes --silent

      - name: Checkout (required to resolve local composite actions)
        uses: actions/checkout@v4

      - name: Verify commenter is authorized
        id: verify
        uses: ./.github/actions/verify-chatops-authorization
        with:
          commenter: ${{ github.event.comment.user.login }}
          authorized-users: ${{ secrets.CHATOPS_AUTHORIZED_USERS }}

      - name: Comment if not authorized
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "❌ @${{ github.event.comment.user.login }} is not authorized to run \`/publish-preview\`. Ask a maintainer to add you to the \`CHATOPS_AUTHORIZED_USERS\` secret."

      - name: Resolve PR head branch and commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json headRefName,headRefOid)
          echo "ref=$(jq -r .headRefName <<<"$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .headRefOid <<<"$PR_JSON")" >> "$GITHUB_OUTPUT"

      - name: Comment if PR resolution failed
        if: ${{ failure() && steps.verify.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "❌ \`/publish-preview\` failed before build/test started. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

  build-test:
    name: Build & test PR branch
    needs: authorize
    uses: ./.github/workflows/build-test.yml
    with:
      ref: ${{ needs.authorize.outputs.sha }}

  notify-build-failure:
    name: Comment build/test failure
    needs: [authorize, build-test]
    if: always() && needs.authorize.result == 'success' && needs.build-test.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "❌ Build/test failed for \`/publish-preview\`. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

  publish-preview:
    name: Pack & push preview package
    needs: [authorize, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          # Full history so existing release tags are visible below.
          fetch-depth: 0

      - uses: ./.github/actions/dotnet-setup

      - name: Compute preview version
        id: version
        env:
          BRANCH: ${{ needs.authorize.outputs.ref }}
        run: |
          LATEST_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          BASE=${LATEST_TAG#v}
          BASE=${BASE:-0.0.0}
          MAJOR=$(cut -d. -f1 <<<"$BASE")
          MINOR=$(cut -d. -f2 <<<"$BASE")
          NEXT_MINOR=$((MINOR + 1))

          # Kebab-case the branch name into a valid SemVer prerelease label:
          # underscores and slashes become dashes, then collapse anything
          # else non-alphanumeric and strip leading/trailing dashes.
          SLUG=$(tr '_/' '--' <<<"$BRANCH" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | sed -E 's/^-+|-+$//g')

          VERSION="${MAJOR}.${NEXT_MINOR}.0-${SLUG}"
          echo "Latest release tag: ${LATEST_TAG:-<none>}"
          echo "Computed preview version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack libraries
        uses: ./.github/actions/pack-libraries
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push preview packages to GitHub Packages
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source github \
            --skip-duplicate

      - name: Comment result on PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "✅ Published preview package \`$VERSION\` to GitHub Packages."

      - name: Comment failure on PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "❌ Packing/publishing the preview package failed. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
